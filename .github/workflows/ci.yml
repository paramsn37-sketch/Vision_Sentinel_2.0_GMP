name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -m "not slow and not model" --cov=app --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run test && npm run build

  e2e:
    # Full stack in file-source mode: the seeded demo cameras play data/samples with the fallback person model.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    env:
      VS_ADMIN_PASSWORD: sentinel-ci-pass
      VS_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: uv sync
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start backend and UI
        run: |
          (cd backend && nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &)
          (cd frontend && nohup npx vite --port 5173 --host 127.0.0.1 > ../vite.log 2>&1 &)
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8000/api/v1/health && break; sleep 2; done
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
      - run: npx playwright test
        working-directory: frontend
      - if: failure()
        run: tail -n 200 backend.log vite.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results
            frontend/e2e/__screenshots__
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Image sizes
        run: |
          docker images --format '{{.Repository}} {{.Size}}' | grep -i sentinel
          size=$(docker image inspect vision_sentinel_20_gmp-backend --format '{{.Size}}')
          echo "backend image: $((size / 1000000)) MB (budget 2500 MB)"
          test "$size" -lt 2500000000
      - name: Smoke-run the stack
        run: |
          VS_ADMIN_PASSWORD=sentinel-ci-pass docker compose up -d
          for i in $(seq 1 90); do curl -sf http://localhost:8080/api/v1/health && break; sleep 2; done
          curl -sf http://localhost:8080/api/v1/health
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
      - if: always()
        run: docker compose logs --tail 100; docker compose down
