[project]
name = "vision-sentinel"
version = "2.0.0.dev0"
description = "Real-time industrial safety monitoring: PPE per tracked person, polygon zones, explainable alerts"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-only"
dependencies = [
  "ultralytics>=8.4.0",
  "torch>=2.4",
  "torchvision>=0.19",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "shapely>=2.0",
  "lap>=0.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlmodel>=0.0.22",
  "pyyaml>=6.0",
  "structlog>=24.4",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5", "hypothesis>=6.112", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]
eval = ["motmetrics>=1.4", "pandas>=2.2", "matplotlib>=3.9", "scikit-image>=0.24"]
train = ["imagehash>=4.3", "requests>=2.32", "pandas>=2.2", "matplotlib>=3.9", "onnx>=1.16", "onnxruntime>=1.19", "onnxslim>=0.1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "app.core.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["model: needs model weights", "slow: long-running"]
addopts = "-q"
